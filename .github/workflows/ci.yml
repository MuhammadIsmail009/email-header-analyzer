name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov pytest-asyncio anyio respx

      - name: Lint (Ruff)
        run: ruff check .

      # Every test runs fully offline — DNS is mocked via StaticResolver, HTTP via
      # respx. No network access or API keys are required or used in CI.
      - name: Test with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -q

      - name: Build Docker image
        run: docker build -t email-header-analyzer:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name eha-ci -p 8000:8000 \
            -e VERIFICATION_ENABLED=false -e ENRICHMENT_ENABLED=false \
            email-header-analyzer:ci
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
          curl -sf -X POST http://127.0.0.1:8000/api/v1/analyze \
            -H "Content-Type: application/json" \
            -d '{"raw_header":"From: alice@example.com\nTo: bob@example.org\n"}'
          docker logs eha-ci
          docker stop eha-ci
